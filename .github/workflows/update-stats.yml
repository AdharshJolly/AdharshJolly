name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh numbers in assets/id-dashboard.svg
        env:
          # Optional: add a classic PAT (scope: read:user) as repo secret STATS_TOKEN
          # to include private contributions. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/id-dashboard.svg README.md
            git commit -m "chore: refresh profile stats"
            git push
          else
            echo "No changes."
          fi
